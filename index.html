<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>WCT Behavioral Assessment &amp; Capability Profiling Tool</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2E4E86;
    --gold: #B08D57;
    --lightgrey: #F2F2F2;
    --midgrey: #D9D9D9;
    --green: #2E7D32;
    --amber: #B8860B;
    --red: #B00020;
    --text: #222;
    /* vibrant accent palette (screen-only personality layer) */
    --violet: #7C5CFC;
    --violet-dark: #5F3DDB;
    --teal: #00BFA6;
    --sky: #2F9BFF;
    --sunny: #FFB236;
    --coral: #FF6B6B;
    --grad: linear-gradient(120deg, var(--violet) 0%, var(--sky) 100%);
    --grad-warm: linear-gradient(120deg, var(--coral) 0%, var(--sunny) 100%);
    --shadow-sm: 0 2px 8px rgba(31,56,100,.08);
    --shadow-md: 0 8px 24px rgba(31,56,100,.12);
    --shadow-lg: 0 16px 40px rgba(31,56,100,.16);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #eef1ff 0%, transparent 60%),
                radial-gradient(1000px 500px at 110% 10%, #eafffb 0%, transparent 55%),
                linear-gradient(180deg, #f5f6fb 0%, #eef1f7 100%);
    background-attachment: fixed;
    color: var(--text);
    margin: 0;
    padding: 0;
  }
  #app { max-width: 960px; margin: 0 auto; padding: 36px 20px 70px; }
  .shell {
    background: #fff; border-radius: 22px; box-shadow: var(--shadow-lg);
    padding: 32px 38px 44px; border: 1px solid #eef0f7;
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { 0% { transform: scale(.55); opacity: 0; } 65% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes floatIn { from { opacity: 0; transform: translateY(-6px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(220px) rotate(540deg); opacity: 0; }
  }
  @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(124,92,252,.45); } 70% { box-shadow: 0 0 0 9px rgba(124,92,252,0); } 100% { box-shadow: 0 0 0 0 rgba(124,92,252,0); } }
  .screen-enter { animation: fadeInUp .45s cubic-bezier(.2,.7,.3,1) both; }

  header.brand {
    position: relative; padding-bottom: 16px; margin-bottom: 26px;
    border-bottom: none;
  }
  header.brand::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 72px;
    border-radius: 4px; background: var(--grad);
  }
  header.brand .kicker {
    color: var(--violet-dark); font-weight: 700; letter-spacing: 1.2px; font-size: 12.5px;
    text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px;
  }
  header.brand .kicker::before { content: "◆"; color: var(--teal); font-size: 10px; }
  header.brand h1 { color: var(--navy); font-size: 27px; margin: 6px 0 0; letter-spacing: -.2px; }

  h2.section-title {
    color: var(--navy); font-size: 19px; margin: 34px 0 12px; padding: 2px 0 2px 16px;
    position: relative; scroll-margin-top: 20px;
  }
  h2.section-title::before {
    content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 5px;
    border-radius: 4px; background: var(--grad);
  }
  h3.sub-title { color: var(--violet-dark); margin: 18px 0 8px; font-size: 15px; font-weight: 700; }

  label { display: block; font-weight: 700; margin: 16px 0 5px; font-size: 14px; color: var(--navy); }
  select, input[type=text] {
    width: 100%; padding: 11px 13px; font-size: 15px;
    border: 1.5px solid var(--midgrey); border-radius: 11px; background: #fbfbfe;
    transition: border-color .15s, box-shadow .15s;
  }
  select:focus, input[type=text]:focus {
    outline: none; border-color: var(--violet); box-shadow: 0 0 0 4px rgba(124,92,252,.14); background: #fff;
  }
  .field-help { font-size: 12.5px; color: #667; margin-top: 5px; line-height: 1.5; }

  .btn {
    display: inline-block; background: var(--grad); color: #fff; border: none;
    padding: 13px 26px; font-size: 15px; font-weight: 600; border-radius: 999px; cursor: pointer;
    margin-top: 20px; box-shadow: 0 6px 16px rgba(95,61,219,.28);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(95,61,219,.36); filter: brightness(1.04); }
  .btn:active { transform: translateY(0) scale(.98); box-shadow: 0 4px 10px rgba(95,61,219,.3); }
  .btn:disabled { background: var(--midgrey); color: #999; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn.secondary {
    background: #fff; color: var(--navy); border: 1.5px solid #dfe3ef; box-shadow: var(--shadow-sm);
  }
  .btn.secondary:hover { border-color: var(--violet); color: var(--violet-dark); box-shadow: var(--shadow-md); transform: translateY(-2px); }

  /* ---- milestone progress bar (quad / likert screens) ---- */
  .progress-shell { margin: 4px 0 26px; }
  .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
  .step-badge {
    background: var(--navy); color: #fff; font-size: 12px; font-weight: 700;
    padding: 5px 12px; border-radius: 999px; letter-spacing: .2px;
  }
  .progress-pct { font-size: 13px; font-weight: 800; color: var(--violet-dark); }
  .progress-track { position: relative; height: 12px; background: var(--lightgrey); border-radius: 999px; overflow: visible; }
  .progress-fill { position: relative; height: 100%; border-radius: 999px; background: var(--grad); transition: width .5s cubic-bezier(.2,.7,.3,1); }
  .progress-dot {
    position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2.5px solid var(--midgrey); transform: translate(-50%,-50%);
    transition: background .3s, border-color .3s;
  }
  .progress-dot.reached { background: var(--teal); border-color: var(--teal); animation: popIn .35s ease; }

  .quad-card { background: #fff; border: 1px solid #eef0f7; border-radius: var(--radius); padding: 20px 22px; margin-top: 8px; box-shadow: var(--shadow-sm); }
  .quad-instructions { font-size: 13.5px; color: #667; margin-bottom: 12px; font-style: italic; }
  .quad-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px dashed #ebedf5; }
  .quad-item:last-child { border-bottom: none; }
  .quad-item .stmt { flex: 1; font-size: 15px; }
  .pill-group { display: flex; gap: 7px; flex-shrink: 0; }
  .pill {
    border: 1.5px solid var(--midgrey); background: #fff; border-radius: 999px;
    padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: transform .12s ease, border-color .12s ease, background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .pill:hover { transform: translateY(-1px); border-color: var(--violet); }
  .pill:active { transform: translateY(0) scale(.95); }
  .pill.most.selected { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 4px 12px rgba(0,191,166,.35); animation: popIn .28s ease; }
  .pill.least.selected { background: var(--coral); border-color: var(--coral); color: #fff; box-shadow: 0 4px 12px rgba(255,107,107,.35); animation: popIn .28s ease; }

  .cognitive-data-table { border-collapse: collapse; margin: 6px 0 14px; font-size: 13.5px; }
  .cognitive-data-table th, .cognitive-data-table td { border: 1px solid #e3e5f0; padding: 6px 14px; text-align: left; }
  .cognitive-data-table th { background: #f2f1fb; color: var(--violet); font-weight: 700; }
  .cognitive-options { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .cognitive-opt { text-align: left; border-radius: 10px; padding: 11px 16px; width: 100%; }
  .cognitive-opt.selected { background: var(--violet); border-color: var(--violet); color: #fff; box-shadow: 0 4px 12px rgba(95,61,219,.3); animation: popIn .28s ease; }

  .likert-item { margin: 14px 0; padding: 14px 16px; background: #fbfbfe; border: 1px solid #eef0f7; border-radius: 12px; transition: box-shadow .15s; }
  .likert-item:hover { box-shadow: var(--shadow-sm); }
  .likert-stmt { font-size: 14.5px; margin-bottom: 10px; }
  .likert-scale { display: flex; gap: 8px; }
  .likert-scale label { font-weight: normal; margin: 0; font-size: 12px; text-align: center; flex: 1; cursor: pointer; color: #556; }
  .likert-scale input { display: block; margin: 0 auto 4px; accent-color: var(--violet); width: 16px; height: 16px; }

  /* ---- quick picks (binary either/or round) ---- */
  .pick-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .pick-card {
    text-align: left; border: 1.5px solid var(--midgrey); background: #fff; border-radius: 14px;
    padding: 16px 18px; font-size: 15px; width: 100%; cursor: pointer; line-height: 1.4;
    transition: transform .12s ease, border-color .12s ease, background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .pick-card:hover { transform: translateY(-1px); border-color: var(--violet); }
  .pick-card:active { transform: translateY(0) scale(.98); }
  .pick-card.selected { background: var(--violet); border-color: var(--violet); color: #fff; box-shadow: 0 4px 12px rgba(95,61,219,.3); animation: popIn .28s ease; }
  .pick-vs { text-align: center; font-size: 11.5px; font-weight: 700; color: #99a; letter-spacing: 1px; margin: -2px 0; }

  /* ---- quickfire true/false round ---- */
  .quickfire-item { margin: 14px 0; padding: 14px 16px; background: #fbfbfe; border: 1px solid #eef0f7; border-radius: 12px; }
  .quickfire-stmt { font-size: 14.5px; margin-bottom: 10px; }
  .quickfire-btns { display: flex; gap: 10px; }
  .quickfire-btn {
    flex: 1; border: 1.5px solid var(--midgrey); background: #fff; border-radius: 10px;
    padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .quickfire-btn:hover { transform: translateY(-1px); border-color: var(--violet); }
  .quickfire-btn.true.selected { background: var(--coral); border-color: var(--coral); color: #fff; box-shadow: 0 4px 12px rgba(255,107,107,.35); animation: popIn .28s ease; }
  .quickfire-btn.false.selected { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 4px 12px rgba(0,191,166,.35); animation: popIn .28s ease; }

  .note-box {
    background: linear-gradient(180deg,#f9f8ff, #f5f4ff); border-left: 5px solid var(--violet);
    padding: 12px 16px; font-size: 13px; color: #444; margin: 16px 0; border-radius: 0 12px 12px 0;
  }
  table.report-table { width: 100%; border-collapse: collapse; margin: 10px 0 18px; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-sm); }
  table.report-table th, table.report-table td {
    border: 1px solid #eef0f7; padding: 9px 12px; font-size: 13.5px; text-align: left;
  }
  table.report-table th { background: var(--navy); color: #fff; }
  table.report-table tr:nth-child(even) td { background: #fafbff; }

  /* ---- score ring ---- */
  .score-hero { display: flex; gap: 28px; align-items: center; margin: 20px 0; flex-wrap: wrap; }
  .score-ring {
    width: 154px; height: 154px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md);
    animation: floatIn .5s ease both;
  }
  .score-ring-inner {
    width: 116px; height: 116px; border-radius: 50%; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-ring-inner .num { font-size: 30px; font-weight: 800; color: var(--navy); }
  .score-ring-inner .band { font-size: 11px; color: #667; margin-top: 3px; text-align: center; font-weight: 600; }
  .badge { display: inline-block; padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #fff; }
  .badge.valid { background: var(--teal); }
  .badge.caution { background: var(--sunny); color: #543; }
  .badge.invalid { background: var(--coral); }

  .domain-bar-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
  .domain-bar-label { width: 230px; font-size: 13px; flex-shrink: 0; font-weight: 600; color: #445; }
  .domain-bar-track { flex: 1; background: var(--lightgrey); border-radius: 999px; height: 14px; overflow: hidden; }
  .domain-bar-fill { height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.2,.7,.3,1); }
  .strength-item, .derailer-item { padding: 9px 0; border-bottom: 1px dashed #ebedf5; font-size: 14px; }
  .strength-item b, .derailer-item b { color: var(--navy); }
  .interview-q { padding: 9px 0 9px 14px; border-left: 3px solid var(--violet); margin: 8px 0; font-size: 14px; }

  /* domain color coding — scoped to the specific bar-fill elements only, so it
     doesn't clash with .trait-card's own white background further down */
  .domain-bar-fill.dom-L, .wheel-trait-row .fill.dom-L { background: var(--violet); }
  .domain-bar-fill.dom-I, .wheel-trait-row .fill.dom-I { background: var(--teal); }
  .domain-bar-fill.dom-P, .wheel-trait-row .fill.dom-P { background: var(--sky); }
  .domain-bar-fill.dom-A, .wheel-trait-row .fill.dom-A { background: var(--sunny); }
  .domain-bar-fill.dom-D, .wheel-trait-row .fill.dom-D { background: var(--coral); }
  .wheel-domain.dom-L h4 { color: var(--violet); } .wheel-domain.dom-L { border-top: 3px solid var(--violet); }
  .wheel-domain.dom-I h4 { color: #009484; } .wheel-domain.dom-I { border-top: 3px solid var(--teal); }
  .wheel-domain.dom-P h4 { color: #1a7fe0; } .wheel-domain.dom-P { border-top: 3px solid var(--sky); }
  .wheel-domain.dom-A h4 { color: #b3791f; } .wheel-domain.dom-A { border-top: 3px solid var(--sunny); }
  .wheel-domain.dom-D h4 { color: #d64545; } .wheel-domain.dom-D { border-top: 3px solid var(--coral); }
  .trait-card.dom-L { border-left-color: var(--violet); }
  .trait-card.dom-I { border-left-color: var(--teal); }
  .trait-card.dom-P { border-left-color: var(--sky); }
  .trait-card.dom-A { border-left-color: var(--sunny); }
  .trait-card.dom-D { border-left-color: var(--coral); }

  /* ---- expanded report styling ---- */
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 26px; }
  .toc a {
    font-size: 12px; color: var(--navy); text-decoration: none; border: 1px solid #e3e6f2;
    padding: 6px 13px; border-radius: 999px; background: #f7f7fd; font-weight: 600;
    transition: background .15s, transform .15s, color .15s;
  }
  .toc a:hover { background: var(--grad); color: #fff; transform: translateY(-1px); }
  .gauge-wrap { margin: 20px 0; }
  .gauge-track { position: relative; height: 22px; border-radius: 11px; background: linear-gradient(to right, #eef0f7 0%, #eef0f7 55%, #d9f2ee 55%, #d9f2ee 75%, #c7ecdf 75%, #c7ecdf 100%); overflow: visible; }
  .gauge-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--grad); border-radius: 11px 0 0 11px; transition: width .6s cubic-bezier(.2,.7,.3,1); }
  .gauge-labels { display: flex; justify-content: space-between; font-size: 11px; color: #667; margin-top: 5px; }
  .trait-card {
    background: #fff; border: 1px solid #eef0f7; border-left-width: 5px; border-left-style: solid;
    border-radius: 12px; padding: 17px 19px; margin: 13px 0; box-shadow: var(--shadow-sm); break-inside: avoid;
    transition: box-shadow .15s, transform .15s;
  }
  .trait-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .trait-card .th { display: flex; justify-content: space-between; align-items: baseline; }
  .trait-card .th b { color: var(--navy); font-size: 15px; }
  .trait-card .th .sc { font-weight: 800; color: var(--violet-dark); font-size: 15px; }
  .trait-card .def { font-size: 12.5px; color: #667; font-style: italic; margin: 4px 0 10px; }
  .impact-bar-wrap { margin: 7px 0 10px; }
  .impact-bar-labels { display: flex; justify-content: space-between; font-size: 10px; color: #889; margin-bottom: 3px; }
  .impact-bar-track { position: relative; height: 14px; background: linear-gradient(to right, #ffe1e1 0%, #f3f3f8 50%, #d7f5ee 100%); border-radius: 7px; border: 1px solid #eef0f7; }
  .impact-bar-marker { position: absolute; top: -3px; width: 13px; height: 20px; border-radius: 50%; background: var(--navy); border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(31,56,100,.4); transform: translateX(-50%); }
  .trait-narrative { font-size: 13px; color: #333; line-height: 1.5; }
  .wheel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 16px 0; }
  .wheel-domain { background: #fff; border: 1px solid #eef0f7; border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
  .wheel-domain h4 { margin: 0 0 9px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800; }
  .wheel-trait-row { display: flex; align-items: center; gap: 7px; margin: 6px 0; font-size: 11.5px; }
  .wheel-trait-row .lbl { width: 96px; flex-shrink: 0; color: #556; }
  .wheel-trait-row .track { flex: 1; height: 8px; background: var(--lightgrey); border-radius: 999px; overflow: hidden; }
  .wheel-trait-row .fill { height: 100%; border-radius: 999px; }
  .tension-row { margin: 18px 0; }
  .tension-labels { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
  .tension-track { position: relative; height: 18px; background: var(--lightgrey); border-radius: 9px; }
  .tension-mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--midgrey); }
  .tension-fill { position: absolute; top: 0; bottom: 0; background: var(--grad); border-radius: 9px; }

  /* ---- Paradox Graph (two-axis quadrant plot) ---- */
  .paradox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin: 16px 0; }
  .paradox-card {
    background: #fff; border: 1px solid #eef0f7; border-radius: var(--radius);
    padding: 18px 20px 20px; box-shadow: var(--shadow-sm); break-inside: avoid;
  }
  .paradox-card h4 { margin: 0 0 12px; color: var(--navy); font-size: 15px; }
  .paradox-layout { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .paradox-axis-y-label {
    font-size: 9.5px; font-weight: 700; color: var(--navy); text-transform: uppercase;
    letter-spacing: .3px; writing-mode: vertical-rl; transform: rotate(180deg);
    text-align: center; flex-shrink: 0; padding: 4px 0;
  }
  .paradox-square-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .paradox-square {
    position: relative; width: 190px; height: 190px;
    background: linear-gradient(135deg, #eafffb 0%, #eef1ff 100%);
    border: 2px solid var(--navy); border-radius: 8px; overflow: hidden;
  }
  .pq-cross-v { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #b9c2d6; }
  .pq-cross-h { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #b9c2d6; }
  .pq-quad-label {
    position: absolute; font-size: 8px; font-weight: 800; color: #5a6785;
    text-transform: uppercase; letter-spacing: .2px; line-height: 1.25; max-width: 82px;
  }
  .pq-quad-label.tl { top: 6px; left: 7px; }
  .pq-quad-label.tr { top: 6px; right: 7px; text-align: right; }
  .pq-quad-label.bl { bottom: 6px; left: 7px; }
  .pq-quad-label.br { bottom: 6px; right: 7px; text-align: right; }
  .pq-quad-label.active { color: var(--violet-dark); }
  .pq-halo {
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,92,252,.38) 0%, rgba(124,92,252,0) 72%);
    pointer-events: none;
  }
  .pq-dot {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: var(--coral); border: 2.5px solid #fff; box-shadow: 0 0 0 1px var(--coral), 0 2px 6px rgba(0,0,0,.25);
  }
  .paradox-axis-x-label {
    font-size: 9.5px; font-weight: 700; color: var(--navy); text-transform: uppercase;
    letter-spacing: .3px; margin-top: 6px; text-align: center;
  }
  .paradox-info { flex: 1 1 220px; min-width: 200px; }
  .paradox-def { font-size: 11px; color: #556; margin-bottom: 5px; line-height: 1.45; }
  .paradox-def b { color: var(--navy); }
  .paradox-combo-list { font-size: 10.5px; color: #556; line-height: 1.5; margin-top: 8px; }
  .paradox-combo-list .combo-item { margin-bottom: 4px; }
  .paradox-combo-list .combo-item.active { background: #f5f3ff; border-radius: 6px; padding: 3px 6px; margin: 0 -6px 4px; }
  .paradox-combo-list b { color: var(--navy); }
  .paradox-narrative { margin-top: 10px; font-size: 12px; line-height: 1.5; }
  .keyword-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 12px 0; }
  .keyword-col h4 { font-size: 12.5px; color: var(--navy); margin-bottom: 9px; }
  .keyword-pill { display: inline-block; border-radius: 999px; padding: 4px 12px; font-size: 12px; margin: 3px 5px 3px 0; font-weight: 600; }

<div id="app"></div>

<!-- Used only by the "Download Report (PDF)" button on the results screen, to
     generate a real, dialog-free PDF download with a consistent filename.
     Requires internet access at the moment the report is downloaded — every
     other part of this tool (taking the assessment, scoring, and the native
     "Print / Save as PDF" button) works fully offline without this script. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.12.1/html2pdf.bundle.min.js"></script>

<!-- Candidate/remote mode auto-emails the finished report to HR (never displaying it
     to the candidate) by POSTing to a Power Automate flow connected to HR's own
     Outlook account — no third-party email service or library needed, just the
     browser's native fetch(). Requires internet access at submit time. -->

<script>
/* ============================================================
   PART A — CORE SCORING LOGIC
   (identical in structure to scoring_core.js, verified separately with Node)
   ============================================================ */
/* ============================================================
   WCT Behavioral Assessment - CORE SCORING LOGIC (pure, no DOM)
   This file is written so it can be tested standalone with Node
   AND pasted into the browser tool. Do not add any DOM calls here.
   ============================================================ */

// ---------- 15 traits, grouped into 5 domains ----------
const TRAITS = [
  { id: "L1", domain: "L", label: "Strategic Direction-Setting" },
  { id: "L2", domain: "L", label: "Decision-Making Under Ownership" },
  { id: "L3", domain: "L", label: "Results & Performance Drive" },
  { id: "I1", domain: "I", label: "Communication & Persuasion" },
  { id: "I2", domain: "I", label: "Collaboration & Team Orientation" },
  { id: "I3", domain: "I", label: "Stakeholder & Authority Management" },
  { id: "P1", domain: "P", label: "Attention to Detail / Accuracy" },
  { id: "P2", domain: "P", label: "Practical / Innovative Problem Solving" },
  { id: "P3", domain: "P", label: "Risk & Compliance Judgment" },
  { id: "A1", domain: "A", label: "Stress Tolerance / Composure" },
  { id: "A2", domain: "A", label: "Change Adaptability" },
  { id: "A3", domain: "A", label: "Learning Agility" },
  { id: "D1", domain: "D", label: "Conscientiousness & Reliability" },
  { id: "D2", domain: "D", label: "Initiative & Self-Motivation" },
  { id: "D3", domain: "D", label: "Integrity & Rule Adherence" },
];

const DOMAIN_LABELS = {
  L: "Leadership & Execution",
  I: "Interpersonal & Influence Dynamics",
  P: "Problem Solving & Analytical Thinking",
  A: "Agility, Resilience & Adaptability",
  D: "Personal Drive & Work Ethic / Integrity",
};

// ---------- 8 job families: base weight across 5 domains (sums to 100) ----------
const FAMILIES = {
  leadership:   { label: "Leadership & Executive",                 base: { L: 30, I: 25, P: 20, A: 15, D: 10 } },
  finance:      { label: "Finance, Accounts & Commercial Risk",     base: { L: 10, I: 10, P: 40, A: 15, D: 25 } },
  engineering:  { label: "Engineering, Technical & Construction",   base: { L: 15, I: 10, P: 35, A: 25, D: 15 } },
  operations:   { label: "Operations & Facilities Management",      base: { L: 20, I: 15, P: 25, A: 25, D: 15 } },
  sales:        { label: "Sales, Marketing, Leasing & Commercial",   base: { L: 15, I: 40, P: 15, A: 20, D: 10 } },
  hr:           { label: "HR, Admin, Legal & Corporate Support",     base: { L: 10, I: 30, P: 20, A: 20, D: 20 } },
  hospitality:  { label: "Hospitality, F&B & Guest Services",        base: { L: 10, I: 35, P: 15, A: 25, D: 15 } },
  safety:       { label: "Safety, Health, Security & Compliance",    base: { L: 10, I: 15, P: 30, A: 15, D: 30 } },
};

// ---------- 4 tiers: multipliers across 5 domains ----------
const TIERS = {
  tier1: { label: "Tier 1 – Support / Operational",   mult: { L: 0.5, I: 0.8, P: 1.0, A: 0.9, D: 1.3 } },
  tier2: { label: "Tier 2 – Executive / Professional", mult: { L: 0.8, I: 0.9, P: 1.2, A: 1.0, D: 1.2 } },
  tier3: { label: "Tier 3 – Management",                mult: { L: 1.3, I: 1.1, P: 1.0, A: 1.1, D: 1.0 } },
  tier4: { label: "Tier 4 – Senior / C-Suite",          mult: { L: 1.6, I: 1.3, P: 0.9, A: 1.2, D: 0.9 } },
};

const TIER_ORDER = ["tier1", "tier2", "tier3", "tier4"];

// use-case context modifiers (Section 6 of the framework)
const CONTEXTS = {
  recruitment: { label: "Recruitment", domainBoost: {} },
  promotion:   { label: "Promotion Readiness", domainBoost: {}, promoteTier: true },
  increment:   { label: "Increment / Merit Adjustment", domainBoost: { L3: 1.2, I2: 1.2, A1: 1.2 } },
};

// ---------- Compute the final weight (0..1) of every one of the 15 traits ----------
function computeTraitWeights(familyKey, tierKey, contextKey) {
  const family = FAMILIES[familyKey];
  const tier = TIERS[tierKey];
  const ctx = CONTEXTS[contextKey] || CONTEXTS.recruitment;

  // domain weight = base * multiplier, normalized to sum 100
  const raw = {};
  let sum = 0;
  for (const d of Object.keys(DOMAIN_LABELS)) {
    raw[d] = family.base[d] * tier.mult[d];
    sum += raw[d];
  }
  const domainWeight = {};
  for (const d of Object.keys(raw)) domainWeight[d] = raw[d] / sum; // fraction of 1

  // split each domain weight evenly across its 3 traits, then apply context boosts to individual traits
  const traitWeight = {};
  for (const t of TRAITS) {
    traitWeight[t.id] = domainWeight[t.domain] / 3;
  }
  for (const [traitId, boost] of Object.entries(ctx.domainBoost || {})) {
    if (traitWeight[traitId] != null) traitWeight[traitId] *= boost;
  }
  // renormalize to sum to 1 after any boosts
  let total = 0;
  for (const id of Object.keys(traitWeight)) total += traitWeight[id];
  for (const id of Object.keys(traitWeight)) traitWeight[id] = traitWeight[id] / total;

  return traitWeight;
}

// If context is "promotion", score against one tier UP from the candidate's current tier
function effectiveTier(tierKey, contextKey) {
  const ctx = CONTEXTS[contextKey] || CONTEXTS.recruitment;
  if (!ctx.promoteTier) return tierKey;
  const idx = TIER_ORDER.indexOf(tierKey);
  return TIER_ORDER[Math.min(idx + 1, TIER_ORDER.length - 1)];
}

// ---------- Raw ipsative scoring from quad answers ----------
// answers: array of { quadId, most: traitId, least: traitId }
// quads: array of { id, items: [{trait, text}, {trait, text}, {trait, text}, {trait, text}] }
function scoreQuads(quads, answers) {
  const rawTally = {};
  const appearances = {};
  for (const t of TRAITS) { rawTally[t.id] = 0; appearances[t.id] = 0; }

  for (const quad of quads) {
    for (const item of quad.items) appearances[item.trait]++;
  }
  const answerByQuad = {};
  for (const a of answers) answerByQuad[a.quadId] = a;

  for (const quad of quads) {
    const ans = answerByQuad[quad.id];
    if (!ans) continue;
    if (ans.most) rawTally[ans.most] += 1;
    if (ans.least) rawTally[ans.least] -= 1;
  }

  // normalize each trait to a pseudo z-score in roughly [-2, +2]
  const z = {};
  for (const t of TRAITS) {
    const n = appearances[t.id] || 1;
    const norm0to100 = ((rawTally[t.id] + n) / (2 * n)) * 100; // 0..100
    z[t.id] = (norm0to100 - 50) / 25; // ~ -2..+2
  }
  return { rawTally, appearances, z };
}

// Benchmark ideal-profile rule (v1, illustrative pending real WCT norm data):
// the target z for a trait scales with how heavily that trait is weighted for
// THIS specific family/tier — the highest-weighted trait for the role gets a
// target near +2.0 ("should be strong here"), the lowest-weighted trait gets a
// lenient target near +0.4 ("doesn't need to be strong to fit this role").
// This is what makes the benchmark shape genuinely follow the Dynamic
// Weighting Engine rather than demanding every candidate be high on all 15
// traits regardless of relevance to the role.
function defaultBenchmarkFromWeights(traitWeight) {
  const weights = Object.values(traitWeight);
  const max = Math.max(...weights);
  const min = Math.min(...weights);
  const range = max - min || 1;
  const target = {};
  for (const id of Object.keys(traitWeight)) {
    const norm = (traitWeight[id] - min) / range; // 0..1
    target[id] = 0.4 + 1.6 * norm; // 0.4 .. 2.0
  }
  return target;
}

// ---------- Suitability score (Section 4 formula) ----------
// benchmarkZ: target z per trait. If omitted, derived from the trait weights
// themselves via defaultBenchmarkFromWeights (see note above). Pass an
// explicit benchmarkZ to override specific traits with a non-monotonic ideal
// (e.g., capping Assertive Influence for a diplomacy-heavy role).
function suitabilityScore(zCandidate, traitWeight, benchmarkZ = null, cap = 2.5) {
  const targets = benchmarkZ || defaultBenchmarkFromWeights(traitWeight);
  let numerator = 0;
  let denominator = 0;
  const gaps = {};
  for (const t of TRAITS) {
    const w = traitWeight[t.id] || 0;
    const target = targets[t.id] != null ? targets[t.id] : 1.2;
    const gap = Math.min(Math.abs(zCandidate[t.id] - target), cap);
    gaps[t.id] = { gap, target, weight: w, z: zCandidate[t.id] };
    numerator += w * gap;
    denominator += w * cap;
  }
  const score = 100 * (1 - numerator / denominator);
  return { score: Math.max(0, Math.min(100, score)), gaps };
}

// Recruitment Readiness Index — same underlying Suitability Score/thresholds as the
// original Fit Band, relabeled and given a recommended next action for a hiring context.
function fitBand(score) {
  if (score > 85) return "Ready Now";
  if (score >= 70) return "Ready with Onboarding Support";
  return "Not Yet Ready";
}
function readinessAction(band) {
  if (band === "Ready Now") return "This candidate can step into the role with minimal ramp-up. Proceed with standard onboarding.";
  if (band === "Ready with Onboarding Support") return "This candidate can perform the role but will need structured onboarding support on the specific gap traits below. Use the Interview Guide to confirm before extending an offer.";
  return "Material gaps against this role's benchmark. Consider a different role/tier, or revisit after further development.";
}

// ---------- Response Consistency (per-trait repeat/paraphrase check) ----------
// likertResponses: [{trait, keyed: "pos"|"neg", rating: 1..5}] — the ~75-item
// bank asks each of the 15 traits about 5 times, in different wording (some
// straight, some reverse-worded). A genuine respondent's answers for a given
// trait should cluster together once "neg" items are flipped back (6 - rating);
// someone answering randomly, or trying to fake a uniformly good profile,
// will tend to produce a wide spread within at least some traits. This is the
// main "harder to lie" signal — most of the ~100-item length of the full
// assessment comes from this bank existing at all.
function traitLikertConsistency(likertResponses) {
  const byTrait = {};
  for (const r of likertResponses) {
    if (r == null || r.rating == null) continue;
    const dirVal = r.keyed === "neg" ? 6 - r.rating : r.rating; // 1..5, higher = more of the trait
    (byTrait[r.trait] = byTrait[r.trait] || []).push(dirVal);
  }
  const perTrait = {};
  let sumScore = 0, n = 0;
  for (const [traitId, vals] of Object.entries(byTrait)) {
    if (vals.length < 2) continue;
    const spread = Math.max(...vals) - Math.min(...vals); // 0..4
    const score = Math.max(0, 100 - (spread / 4) * 100);
    perTrait[traitId] = { values: vals, spread, score };
    sumScore += score;
    n++;
  }
  const avgScore = n ? sumScore / n : 100;
  const flaggedTraits = Object.entries(perTrait).filter(([, v]) => v.spread >= 3).map(([id]) => id);
  return { avgScore, perTrait, flaggedTraits };
}

// ---------- Validity / Response Consistency Index (Section 5) ----------
// traitConsistencyScore: 0..100, from traitLikertConsistency() above — this is
// now the dominant signal (built from ~75 items instead of a handful).
// bogusRatings: array of 1..5 ratings on paradoxical/bogus items
// reversalChecks: array of {consistent: boolean} (from the forced-choice quads)
// avgSecPerQuad: number
function validityIndex({ traitConsistencyScore = 100, bogusRatings = [], reversalChecks = [], avgSecPerQuad = 10 }) {
  let idx = traitConsistencyScore;
  const flags = [];

  for (const r of bogusRatings) {
    if (r >= 4) {
      idx -= 15;
      flags.push("Paradoxical/bogus item endorsed");
    }
  }
  for (const rc of reversalChecks) {
    if (!rc.consistent) {
      idx -= 10;
      flags.push("Preference-reversal inconsistency on repeated trait pair");
    }
  }
  if (avgSecPerQuad < 2.5) {
    idx -= 10;
    flags.push("Very fast completion time (possible careless responding)");
  }
  idx = Math.max(0, Math.min(100, Math.round(idx)));

  let rating = "Valid";
  if (idx < 60) rating = "Invalid";
  else if (idx < 80) rating = "Caution";

  return { index: idx, rating, flags: [...new Set(flags)] };
}

// ---------- Cognitive & Problem-Solving Aptitude (Section 6b) ----------
// items: COGNITIVE_ITEMS (each {id, category: "numerical"|"logical", correctIndex, ...})
// answers: {itemId -> selectedIndex}. Purely objective right/wrong scoring —
// informational only, never blended into the Suitability Score (same policy
// as the About You / Values / EQ sections).
function scoreCognitive(items, answers) {
  let correct = 0, numCorrect = 0, numTotal = 0, logCorrect = 0, logTotal = 0;
  for (const item of items) {
    const isCorrect = answers[item.id] === item.correctIndex;
    if (isCorrect) correct++;
    if (item.category === "numerical") { numTotal++; if (isCorrect) numCorrect++; }
    else { logTotal++; if (isCorrect) logCorrect++; }
  }
  const total = items.length || 1;
  return {
    correctCount: correct,
    totalCount: items.length,
    overallPct: Math.round((correct / total) * 100),
    numericalPct: numTotal ? Math.round((numCorrect / numTotal) * 100) : null,
    logicalPct: logTotal ? Math.round((logCorrect / logTotal) * 100) : null,
  };
}
function cognitiveBand(pct) {
  if (pct >= 80) return "Strong";
  if (pct >= 60) return "Solid";
  if (pct >= 40) return "Developing";
  return "Needs Support";
}

// ---------- Strengths / Derailers ----------
function strengthsAndDerailers(gaps, topN = 4) {
  const arr = TRAITS.map((t) => ({
    id: t.id,
    label: t.label,
    z: gaps[t.id].z,
    target: gaps[t.id].target,
    weight: gaps[t.id].weight,
    signedGap: gaps[t.id].z - gaps[t.id].target, // positive = above target
  }));
  const strengths = arr
    .filter((x) => x.signedGap >= -0.3)
    .sort((a, b) => b.weight * (b.z) - a.weight * (a.z))
    .slice(0, topN);
  const derailers = arr
    .filter((x) => x.signedGap < -0.3)
    .sort((a, b) => b.weight * Math.abs(b.signedGap) - a.weight * Math.abs(a.signedGap))
    .slice(0, topN);
  return { strengths, derailers };
}

if (typeof module !== "undefined") {
  module.exports = {
    TRAITS, DOMAIN_LABELS, FAMILIES, TIERS, TIER_ORDER, CONTEXTS,
    computeTraitWeights, effectiveTier, scoreQuads, suitabilityScore,
    fitBand, readinessAction, validityIndex, traitLikertConsistency,
    scoreCognitive, cognitiveBand, strengthsAndDerailers,
  };
}


/* ============================================================
   PART B — QUESTION BANK
   ============================================================ */
/* ============================================================
   WCT Behavioral Assessment - QUESTION BANK
   26 forced-choice quads (Most-like-me / Least-like-me), covering
   all 15 traits multiple times, plus validity-check items.
   ============================================================ */

const QUADS = [

    { trait: "A3", text: "I actively seek out new tools or methods rather than waiting to be trained." },

// ---------- Likert item split for mixed-format presentation ----------
// The 60 trait statements above (4 per trait: two positively-keyed "a"/"b"
// items, two negatively-keyed "d"/"e" items) used to all be rendered as flat
// 1-5 rating rows on one long scrolling screen — repetitive for the candidate.
// To vary the interaction style without touching the underlying scoring:
//   - the "a"/"d" pair per trait (30 items) stays a classic 1-5 rating.
//   - the "b"/"e" pair per trait (30 items) instead becomes 15 quick binary
//     "which is more true of you" picks, each pairing one trait's statement
//     against a DIFFERENT, unrelated trait's statement (a fixed offset-of-7
//     pairing across the 15 traits, so no trait is ever paired with itself
//     and there's no obvious "matching" side to guess).
// Whichever statement in a pick is chosen is scored as if rated 5 (strongly
// agree); the other side of that same pick is scored as if rated 1 (strongly
// disagree). That feeds the exact same traitLikertConsistency()/keyed-
// direction math as a normal rating — just captured through one fast tap
// instead of two separate five-point scales.
const RATING_LIKERT_ITEMS = LIKERT_ITEMS.filter((it) => it.id.endsWith("a") || it.id.endsWith("d"));
const PICK_LIKERT_ITEMS = LIKERT_ITEMS.filter((it) => it.id.endsWith("b") || it.id.endsWith("e"));
const TRAIT_ORDER = ["L1", "L2", "L3", "I1", "I2", "I3", "P1", "P2", "P3", "A1", "A2", "A3", "D1", "D2", "D3"];
function findPickItem(traitId, suffix) {
  return PICK_LIKERT_ITEMS.find((it) => it.trait === traitId && it.id.endsWith(suffix));
}
const PICK_PAIRS = TRAIT_ORDER.map((traitId, i) => {
  const otherTrait = TRAIT_ORDER[(i + 7) % TRAIT_ORDER.length];
  return { a: findPickItem(traitId, "b"), b: findPickItem(otherTrait, "e") };
});

// score band from a z (-2..+2 ish) value
function scoreBand(z) {
  if (z >= 1.25) return "very high";
  if (z >= 0.5) return "high";
  if (z >= -0.5) return "moderate";
  if (z >= -1.25) return "low";
  return "very low";
}
function zTo10(z) {
  // map roughly -2..+2 to 0..10
  return Math.max(0, Math.min(10, ((z + 2) / 4) * 10));
}
function narrativeFor(traitId, z) {
  const m = TRAIT_META[traitId];
  const band = scoreBand(z);
  const score10 = zTo10(z).toFixed(1);
  let tail;
  if (band === "very high") tail = `This is one of the candidate's most pronounced tendencies, directly relevant to ${m.predicts}.`;
  else if (band === "high") tail = `This is a genuine strength area relevant to ${m.predicts}.`;
  else if (band === "moderate") tail = `This trait is balanced — neither a standout strength nor a concern for a role involving ${m.predicts}.`;
  else if (band === "low") tail = `This is a developmental area relative to what strong performance on ${m.predicts} typically requires.`;
  else tail = `This is a significant gap area and should be probed directly in interview, given its relevance to ${m.predicts}.`;
  return `Scored ${band} (${score10}/10). ${tail}`;
}

  // ---------------- BUILD ROLE LINK (published/remote path) ----------------
  // The same published file is reused for every role — which role a given link is
  // for travels as URL query params, not as a separately-generated file.
  function buildRoleLink() {
    const qs = "?family=" + encodeURIComponent(state.setup.familyKey) + "&tier=" + encodeURIComponent(state.setup.tierKey)
      + (state.setup.title ? "&title=" + encodeURIComponent(state.setup.title) : "");
    if (state.delivery.siteUrl && state.delivery.siteUrl.trim()) {
      return state.delivery.siteUrl.trim().replace(/\/+$/, "") + "/" + qs;
    }
    return qs;
  }

  // ---------------- GENERATE FILE TO PUBLISH (remote/link path) ----------------
  // Builds a standalone copy of this exact tool with only the delivery settings
  // baked in, by text-replacing the SITE_CONFIG_RAW placeholder inside the
  // pristine ORIGINAL_HTML captured at load time, then triggers a download. This
  // is done ONCE (or again only if delivery settings change) — not per candidate.
  function buildPublishFile() {
    if (!state.delivery.hrEmail || !state.delivery.flowUrl) {
      alert("Please fill in both fields under \"Email Delivery Settings\" first — without these, the tool has no way to send the finished report back to you. See the instructions above for where to find them.");
      return;
    }
    const seed = {
      hrEmail: state.delivery.hrEmail,
      flowUrl: state.delivery.flowUrl,
    };
    const seedJson = JSON.stringify(seed);
    const marker = '"' + "__SITE_CONFIG__" + '"';
    if (ORIGINAL_HTML.indexOf(marker) === -1) {
      alert("Could not generate the file to publish (internal marker not found). Please use the master copy of this tool, not an already-published copy.");
      return;
    }
    const newHtml = "<!DOCTYPE html>\n" + ORIGINAL_HTML.replace(marker, JSON.stringify(seedJson));
    const blob = new Blob([newHtml], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------------- QUAD SCREEN ----------------
  function renderQuad(animate) {
    const total = QUADS.length;
    const idx = state.quadIndex;
    const quad = QUADS[idx];

    const headerInfo = getActivityInfo(idx);
    const wrap = el("div", {}, []);
    wrap.appendChild(el("div", { class: "activity-kicker" }, [text(`Activity ${headerInfo.number} of ${headerInfo.total}`)]));
    wrap.appendChild(el("h2", { class: "section-title", style: "margin-top:4px;" }, [text(headerInfo.activity.name)]));

    // milestone progress bar: dots at 0/25/50/75/100% of the OVERALL 26 items, animated fill, live step counter
    const pct = (idx / total) * 100;
    const milestones = [0, 25, 50, 75, 100];
    const progressShell = el("div", { class: "progress-shell" }, [
      el("div", { class: "progress-meta" }, [
        el("span", { class: "step-badge" }, [text(`Question ${idx + 1} of ${total}`)]),
        el("span", { class: "progress-pct" }, [text(Math.round(pct) + "%")]),
      ]),
      el("div", { class: "progress-track" }, [
        el("div", { class: "progress-fill", style: `width:${pct}%` }),
        ...milestones.map((m) => el("div", { class: "progress-dot" + (pct >= m ? " reached" : ""), style: `left:${m}%` })),
      ]),
    ]);
    wrap.appendChild(progressShell);

    const card = el("div", { class: "quad-card" }, []);
    card.appendChild(el("div", { class: "quad-instructions" }, [text(
      "Of the four statements below, mark the ONE that is Most like you, and the ONE that is Least like you."
    )]));

    const ans = state.quadAnswers[quad.id] || { most: null, least: null };

    quad.items.forEach((item, i) => {
      const row = el("div", { class: "quad-item" }, []);
      row.appendChild(el("div", { class: "stmt" }, [text(item.text)]));
      const pillGroup = el("div", { class: "pill-group" }, []);
      const mostPill = el("button", {
        class: "pill most" + (ans.most === item.trait ? " selected" : ""),
        onclick: () => {
          ans.most = (ans.most === item.trait) ? null : item.trait;
          if (ans.least === ans.most) ans.least = null;
          state.quadAnswers[quad.id] = ans;
          renderQuad(false);
        }
      }, [text(ans.most === item.trait ? "✓ Most like me" : "Most like me")]);
      const leastPill = el("button", {
        class: "pill least" + (ans.least === item.trait ? " selected" : ""),
        onclick: () => {
          ans.least = (ans.least === item.trait) ? null : item.trait;
          if (ans.most === ans.least) ans.most = null;
          state.quadAnswers[quad.id] = ans;
          renderQuad(false);
        }
      }, [text(ans.least === item.trait ? "✓ Least like me" : "Least like me")]);
      pillGroup.appendChild(mostPill);
      pillGroup.appendChild(leastPill);
      row.appendChild(pillGroup);
      card.appendChild(row);
    });

    wrap.appendChild(card);

    const canProceed = ans.most && ans.least && ans.most !== ans.least;

    const btnRow = el("div", {}, []);
    if (idx > 0) {
      btnRow.appendChild(el("button", { class: "btn secondary", onclick: () => {
        state.quadIndex -= 1;
        render();
      }}, [text("← Back")]));
    }
    const activityInfo = headerInfo;
    const nextBtn = el("button", {
      class: "btn",
      disabled: !canProceed,
      onclick: () => {
        const elapsed = (Date.now() - state.quadShownAt) / 1000;
        state.quadTimes[quad.id] = elapsed;
        if (activityInfo.isLast) {
          // last item of this activity — route through a short "Activity complete" beat
          state.justFinishedActivityName = activityInfo.activity.name;
          if (idx + 1 < total) {
            state.quadIndex += 1;
            const nextInfo = getActivityInfo(state.quadIndex);
            state.nextActivityPreview = `Next up: ${nextInfo.activity.name} (${nextInfo.activity.count} item${nextInfo.activity.count === 1 ? "" : "s"}).`;
            state.activityKind = "quad";
          } else {
            state.nextActivityPreview = `Next up: ${COGNITIVE_ACTIVITY.name} — a short mix of calculation and logic questions.`;
            state.activityKind = "cognitive";
          }
          state.screen = "activityComplete";
        } else {
          state.quadIndex += 1;
          state.quadShownAt = Date.now();
          state.screen = "quad";
        }
        render();
      }
    }, [text(activityInfo.isLast ? "Finish Activity →" : "Next →")]);
    btnRow.appendChild(nextBtn);
    wrap.appendChild(btnRow);

    renderScreen(wrap, animate);

  // ---------------- COGNITIVE & PROBLEM-SOLVING CHECK SCREEN ----------------
  // 20 objective multiple-choice items (10 numerical, 10 logical), one per
  // screen — deliberately a different interaction style from both the

  function renderCognitive(animate) {

  // ---------------- ABOUT YOU & YOUR PATH SCREEN (career aspirations + values + EQ) ----------------
  // Everything captured here is self-reported and informational only — none of it is

  function renderAboutYou(animate) {
    const wrap = el("div", {}, []);

    function likeScaleRow(id, statementText, currentValue, onSelect) {
      const item = el("div", { class: "likert-item" }, []);
      item.appendChild(el("div", { class: "likert-stmt" }, [text(statementText)]));
      const scale = el("div", { class: "likert-scale" }, []);
      for (let v = 1; v <= 5; v++) {
        const lbl = el("label", {}, []);
        const inp = el("input", {
          type: "radio", name: id,
          checked: currentValue === v,
          onchange: () => { onSelect(v); renderAboutYou(false); }
        });
        lbl.appendChild(inp);
        lbl.appendChild(text(v === 1 ? "1 (Disagree)" : v === 5 ? "5 (Agree)" : String(v)));
        scale.appendChild(lbl);
      }
      item.appendChild(scale);
      return item;
    }

    // --- Section 1: Career Aspirations ---
    wrap.appendChild(el("h3", { class: "sub-title" }, [text("Your Career Aspirations")]));
    wrap.appendChild(el("label", {}, [text("In 2–3 sentences, what kind of role or career path do you see yourself pursuing over the next few years?")]));
    wrap.appendChild(el("textarea", {
      rows: "3", style: "width:100%;font-family:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--midgrey);",
      value: state.aspirations.path,
      oninput: (e) => { state.aspirations.path = e.target.value; }
    }));

    wrap.appendChild(el("label", { style: "margin-top:14px;display:block;" }, [text("Which direction excites you more?")]));
    const orientationSelect = el("select", { onchange: (e) => { state.aspirations.orientation = e.target.value; renderAboutYou(false); } }, []);
    [
      ["", "— Select —"],
      ["Individual Contributor / Specialist", "Growing deeper as an individual contributor / specialist"],
      ["People Leadership / Management", "Growing into people leadership / management"],
      ["Not Sure Yet", "Not sure yet — open to either"],
    ].forEach(([val, lbl]) => {
      orientationSelect.appendChild(el("option", { value: val, selected: val === state.aspirations.orientation }, [text(lbl)]));
    });
    wrap.appendChild(orientationSelect);

    wrap.appendChild(el("label", { style: "margin-top:14px;display:block;" }, [text("What's your ideal timeframe for taking on a bigger role?")]));
    const timeframeSelect = el("select", { onchange: (e) => { state.aspirations.timeframe = e.target.value; renderAboutYou(false); } }, []);
    [
      ["", "— Select —"],
      ["As soon as possible", "As soon as possible"],
      ["1–2 years", "1–2 years"],
      ["3–5 years", "3–5 years"],
      ["No rush", "No rush — right now I want to master my current role"],
    ].forEach(([val, lbl]) => {
      timeframeSelect.appendChild(el("option", { value: val, selected: val === state.aspirations.timeframe }, [text(lbl)]));
    });
    wrap.appendChild(timeframeSelect);

    // --- Section 2: Values Alignment ---
    wrap.appendChild(el("h3", { class: "sub-title", style: "margin-top:26px;" }, [text("Values Alignment — WCT Holdings Berhad's Core Values")]));
    wrap.appendChild(el("div", { style: "font-size:12.5px;color:#667;margin-bottom:6px;" }, [text("Rate how much each statement describes you, 1 (Strongly Disagree) to 5 (Strongly Agree).")]));
    VALUES_ITEMS.forEach((v) => {
      wrap.appendChild(likeScaleRow(v.id, `[${v.value}] ${v.text}`, state.values[v.id] || null, (val) => { state.values[v.id] = val; }));
    });

    // --- Section 3: EQ Snapshot ---
    wrap.appendChild(el("h3", { class: "sub-title", style: "margin-top:26px;" }, [text("Emotional Intelligence Snapshot")]));
    wrap.appendChild(el("div", { style: "font-size:12.5px;color:#667;margin-bottom:6px;" }, [text("Same 1–5 scale — go with your first instinct.")]));
    EQ_ITEMS.forEach((eq) => {
      wrap.appendChild(likeScaleRow(eq.id, eq.text, state.eq[eq.id] || null, (val) => { state.eq[eq.id] = val; }));
    });

    const allAnswered = state.aspirations.path.trim() && state.aspirations.orientation && state.aspirations.timeframe
      && VALUES_ITEMS.every((v) => state.values[v.id])
      && EQ_ITEMS.every((eq) => state.eq[eq.id]);

    const btnRow = el("div", { style: "margin-top:18px;" }, []);
    btnRow.appendChild(el("button", { class: "btn secondary", onclick: () => {
      state.screen = "quad"; state.quadIndex = QUADS.length - 1; render();
    }}, [text("← Back")]));
    btnRow.appendChild(el("button", {
      class: "btn", disabled: !allAnswered,
      onclick: () => {
        state.justFinishedActivityName = ABOUTYOU_ACTIVITY.name;
        state.nextActivityPreview = `Next up: ${LIKERT_ACTIVITY.name} — a longer set of agree/disagree statements.`;
        state.activityKind = "likert";
        state.screen = "activityComplete";
        render();
      }
    }, [text("Continue →")]));
    wrap.appendChild(btnRow);

    renderScreen(wrap, animate);
  }

  // ---------------- LIKERT / VALIDITY ACTIVITY (3 mixed-format rounds) ----------------
  // This activity used to be one long scroll of 65 identical 1-5 rating rows.
  // It's now three shorter, visually distinct rounds — a rating grid, a set of
  // quick either/or taps, and a rapid-fire true/false check — so the candidate
  // hits a fresh interaction style every couple of minutes instead of one long
  // repetitive form. See the RATING_LIKERT_ITEMS/PICK_PAIRS comment above for
  // exactly how the underlying scoring stays identical across the split.
  function likertHeader(wrap, subLabel) {
    wrap.appendChild(el("div", { class: "activity-kicker" }, [text(`Activity ${ACTIVITIES.length + 3} of ${ACTIVITIES.length + 3}`)]));
    wrap.appendChild(el("h2", { class: "section-title", style: "margin-top:4px;" }, [text(LIKERT_ACTIVITY.name)]));
    wrap.appendChild(el("div", { style: "color:#889;font-size:12.5px;font-weight:700;margin:-6px 0 4px;" }, [text(subLabel)]));
  }

  function renderLikert(animate) {
    if (state.likertStage === "picks") return renderLikertPicks(animate);
    if (state.likertStage === "quickfire") return renderLikertQuickfire(animate);
    return renderLikertRating(animate);
  }

  // ---- Round 1 of 3: classic 1-5 ratings (30 items — half of the original 60) ----
  function renderLikertRating(animate) {
    const wrap = el("div", {}, []);
    likertHeader(wrap, "Round 1 of 3 — Quick Ratings");

    const total = RATING_LIKERT_ITEMS.length;
    const answered = RATING_LIKERT_ITEMS.reduce((s, item) => s + (state.likert[item.id] ? 1 : 0), 0);
    const pct = (answered / total) * 100;
    wrap.appendChild(el("div", { class: "progress-shell" }, [
      el("div", { class: "progress-meta" }, [
        el("span", { class: "step-badge" }, [text(`${answered} of ${total} answered`)]),
        el("span", { class: "progress-pct" }, [text(Math.round(pct) + "%")]),
      ]),
      el("div", { class: "progress-track" }, [
        el("div", { class: "progress-fill", style: `width:${pct}%` }),
      ]),
    ]));

    wrap.appendChild(el("div", { class: "note-box" }, [text(
      "Rate how much you agree with each statement, 1 (Strongly Disagree) to 5 (Strongly Agree). " +
      "Go with your first instinct — there's no trait score attached to any single statement here."
    )]));

    function likertRow(id, statementText, store) {
      const item = el("div", { class: "likert-item" }, []);
      item.appendChild(el("div", { class: "likert-stmt" }, [text(statementText)]));
      const scale = el("div", { class: "likert-scale" }, []);
      for (let v = 1; v <= 5; v++) {
        const lbl = el("label", {}, []);
        const inp = el("input", {
          type: "radio", name: id,
          checked: store.value === v,
          onchange: () => { store.value = v; renderLikertRating(false); }
        });
        lbl.appendChild(inp);
        lbl.appendChild(text(v === 1 ? "1 (Disagree)" : v === 5 ? "5 (Agree)" : String(v)));
        scale.appendChild(lbl);
      }
      item.appendChild(scale);
      return item;
    }

    // RATING_LIKERT_ITEMS is split into 2 equal, generically-labeled "Parts"
    // purely for readability while scrolling — the grouping carries no meaning
    // the candidate could use to guess which statements are paired for scoring.
    const PART_LABELS = ["Part A", "Part B"];
    const perPart = Math.ceil(total / PART_LABELS.length);
    PART_LABELS.forEach((label, pi) => {
      const chunk = RATING_LIKERT_ITEMS.slice(pi * perPart, (pi + 1) * perPart);
      if (!chunk.length) return;
      wrap.appendChild(el("h3", { class: "sub-title" }, [text(label)]));
      chunk.forEach((itemDef) => {
        if (state.likert[itemDef.id] === undefined) state.likert[itemDef.id] = null;
        const store = { get value() { return state.likert[itemDef.id]; }, set value(v) { state.likert[itemDef.id] = v; } };
        wrap.appendChild(likertRow(itemDef.id, itemDef.text, store));
      });
    });

    const allAnswered = RATING_LIKERT_ITEMS.every((item) => state.likert[item.id]);

    const btnRow = el("div", {}, []);
    btnRow.appendChild(el("button", { class: "btn secondary", onclick: () => {
      state.screen = "aboutyou"; render();
    }}, [text("← Back")]));
    btnRow.appendChild(el("button", {
      class: "btn", disabled: !allAnswered,
      onclick: () => { state.likertStage = "picks"; state.pickIndex = 0; render(); }
    }, [text("Continue → Quick Picks")]));
    wrap.appendChild(btnRow);

    renderScreen(wrap, animate);
  }

  // ---- Round 2 of 3: 15 quick binary "which is more true of you" picks ----
  function renderLikertPicks(animate) {
    const wrap = el("div", {}, []);
    likertHeader(wrap, "Round 2 of 3 — Quick Picks");

    const total = PICK_PAIRS.length;
    const idx = state.pickIndex;
    const pair = PICK_PAIRS[idx];
    const pct = (idx / total) * 100;
    wrap.appendChild(el("div", { class: "progress-shell" }, [
      el("div", { class: "progress-meta" }, [
        el("span", { class: "step-badge" }, [text(`Quick Pick ${idx + 1} of ${total}`)]),
        el("span", { class: "progress-pct" }, [text(Math.round(pct) + "%")]),
      ]),
      el("div", { class: "progress-track" }, [
        el("div", { class: "progress-fill", style: `width:${pct}%` }),
      ]),
    ]));

    const card = el("div", { class: "quad-card" }, []);
    card.appendChild(el("div", { class: "quad-instructions" }, [text(
      "Tap whichever statement is more true of you — there's no right answer, just go with your gut."
    )]));

    const picked = state.pickAnswers = state.pickAnswers || {};
    const current = picked[idx]; // "a" | "b" | undefined

    function selectSide(side) {
      picked[idx] = side;
      state.likert[pair.a.id] = side === "a" ? 5 : 1;
      state.likert[pair.b.id] = side === "b" ? 5 : 1;
      renderLikertPicks(false);
    }

    const stack = el("div", { class: "pick-stack" }, []);
    stack.appendChild(el("button", {
      class: "pick-card" + (current === "a" ? " selected" : ""),
      onclick: () => selectSide("a"),
    }, [text((current === "a" ? "✓ " : "") + pair.a.text)]));
    stack.appendChild(el("div", { class: "pick-vs" }, [text("— OR —")]));
    stack.appendChild(el("button", {
      class: "pick-card" + (current === "b" ? " selected" : ""),
      onclick: () => selectSide("b"),
    }, [text((current === "b" ? "✓ " : "") + pair.b.text)]));
    card.appendChild(stack);
    wrap.appendChild(card);

    const canProceed = !!current;
    const btnRow = el("div", {}, []);
    if (idx > 0) {
      btnRow.appendChild(el("button", { class: "btn secondary", onclick: () => {
        state.pickIndex -= 1; render();
      }}, [text("← Back")]));
    } else {
      btnRow.appendChild(el("button", { class: "btn secondary", onclick: () => {
        state.likertStage = "rating"; render();
      }}, [text("← Back")]));
    }
    btnRow.appendChild(el("button", {
      class: "btn", disabled: !canProceed,
      onclick: () => {
        if (idx + 1 < total) {
          state.pickIndex += 1;
        } else {
          state.likertStage = "quickfire";
        }
        render();
      }
    }, [text(idx + 1 < total ? "Next →" : "Continue → Quickfire Check")]));
    wrap.appendChild(btnRow);

    renderScreen(wrap, animate);
  }

  // ---- Round 3 of 3: 5-item rapid-fire true/false validity check ----
  function renderLikertQuickfire(animate) {
    const wrap = el("div", {}, []);
    likertHeader(wrap, "Round 3 of 3 — Quickfire Check");

    const total = BOGUS_ITEMS.length;
    const answered = BOGUS_ITEMS.reduce((s, b) => s + (state.bogus[b.id] ? 1 : 0), 0);
    const pct = (answered / total) * 100;
    wrap.appendChild(el("div", { class: "progress-shell" }, [
      el("div", { class: "progress-meta" }, [
        el("span", { class: "step-badge" }, [text(`${answered} of ${total} answered`)]),
        el("span", { class: "progress-pct" }, [text(Math.round(pct) + "%")]),
      ]),
      el("div", { class: "progress-track" }, [
        el("div", { class: "progress-fill", style: `width:${pct}%` }),
      ]),
    ]));

    wrap.appendChild(el("div", { class: "note-box" }, [text(
      "Last stretch — a handful of quick true/false calls. Tap your gut answer for each."
    )]));

    BOGUS_ITEMS.forEach((bg) => {
      const item = el("div", { class: "quickfire-item" }, []);
      item.appendChild(el("div", { class: "quickfire-stmt" }, [text(bg.text)]));
      const current = state.bogus[bg.id]; // 5 = True, 1 = False, null/undefined = unanswered
      const btns = el("div", { class: "quickfire-btns" }, []);
      btns.appendChild(el("button", {
        class: "quickfire-btn true" + (current === 5 ? " selected" : ""),
        onclick: () => { state.bogus[bg.id] = 5; renderLikertQuickfire(false); },
      }, [text((current === 5 ? "✓ " : "") + "True")]));
      btns.appendChild(el("button", {
        class: "quickfire-btn false" + (current === 1 ? " selected" : ""),
        onclick: () => { state.bogus[bg.id] = 1; renderLikertQuickfire(false); },
      }, [text((current === 1 ? "✓ " : "") + "False")]));
      item.appendChild(btns);
      wrap.appendChild(item);
    });

    const allAnswered = BOGUS_ITEMS.every((b) => state.bogus[b.id]);

    const btnRow = el("div", {}, []);
    btnRow.appendChild(el("button", { class: "btn secondary", onclick: () => {
      state.likertStage = "picks"; state.pickIndex = PICK_PAIRS.length - 1; render();
    }}, [text("← Back")]));
    btnRow.appendChild(el("button", {
      class: "btn", disabled: !allAnswered,
      onclick: () => {
        if (isPublishedMode) {
          // Remote/candidate mode: the report is never rendered on screen here —
          // it's computed and emailed straight to HR in submitRemoteReport().
          state.remoteSendStatus = "sending";
          state.screen = "remoteSubmit";
          render();
          submitRemoteReport();
        } else {
          state.screen = "handoff";
          render();
        }
      }
    }, [text("Finish →")]));
    wrap.appendChild(btnRow);

    renderScreen(wrap, animate);
  }

  // ---------------- SHARED REPORT COMPUTATION ----------------
  // Used by both the on-screen HR/in-person report (renderResults) and the
  // remote/candidate auto-email flow (submitRemoteReport) — one source of truth
  // for scoring so the two paths can never drift apart.
  function computeReportData() {
    const { z } = scoreQuads(QUADS, Object.keys(state.quadAnswers).map((qid) => ({ quadId: qid, ...state.quadAnswers[qid] })));
    const effTier = effectiveTier(state.setup.tierKey, state.setup.contextKey);
    const weights = computeTraitWeights(state.setup.familyKey, effTier, state.setup.contextKey);
    const { score, gaps } = suitabilityScore(z, weights);
    const band = fitBand(score);

    const reversalChecks = REVERSAL_CHECK_PAIRS.map((rc) => {
      const ansA = state.quadAnswers[rc.quadA] || {};
      const ansB = state.quadAnswers[rc.quadB] || {};
      const prefA = (ansA.most === rc.traitX ? 1 : 0) - (ansA.least === rc.traitX ? 1 : 0)
                  - ((ansA.most === rc.traitY ? 1 : 0) - (ansA.least === rc.traitY ? 1 : 0));
      const prefB = (ansB.most === rc.traitX ? 1 : 0) - (ansB.least === rc.traitX ? 1 : 0)
                  - ((ansB.most === rc.traitY ? 1 : 0) - (ansB.least === rc.traitY ? 1 : 0));
      const consistent = (prefA === 0 || prefB === 0) ? true : (Math.sign(prefA) === Math.sign(prefB));
      return { consistent };
    });
    // Only the pure 1-5 rating items (RATING_LIKERT_ITEMS) feed the consistency
    // check — the Quick Picks round is a forced binary choice, so it always
    // lands on an extreme (rated as if 5 or 1). Mixing those extremes into a
    // spread calculation designed for continuous 1-5 ratings would flag even a
    // genuinely consistent candidate as contradictory, since forced-choice and
    // free ratings aren't directly comparable on the same numeric scale.
    const likertResponses = RATING_LIKERT_ITEMS.map((item) => ({ trait: item.trait, keyed: item.keyed, rating: state.likert[item.id] }));
    const traitConsistency = traitLikertConsistency(likertResponses);
    const bogusRatings = BOGUS_ITEMS.map((b) => state.bogus[b.id]);
    const times = Object.values(state.quadTimes);
    const avgSec = times.length ? times.reduce((a, b) => a + b, 0) / times.length : 10;
    const validity = validityIndex({ traitConsistencyScore: traitConsistency.avgScore, bogusRatings, reversalChecks, avgSecPerQuad: avgSec });

    const { strengths, derailers } = strengthsAndDerailers(gaps, 15);
    const traitById = {};
    TRAITS.forEach((t) => (traitById[t.id] = t));
    const rankedTraits = TRAITS.map((t) => ({ ...t, z: z[t.id], weight: weights[t.id] }))
      .sort((a, b) => b.weight - a.weight);

    const cognitive = scoreCognitive(COGNITIVE_ITEMS, state.cognitiveAnswers);

    return { z, effTier, weights, score, gaps, band, validity, traitConsistency, cognitive, strengths, derailers, traitById, rankedTraits };
  }

  // ---------------- EMAIL-SAFE REPORT HTML (for the auto-emailed remote report) ----------------
  // Email clients strip <style> blocks and don't support flexbox/grid/CSS variables,
  // so this is a separate, deliberately simple, all-inline-style rendering — not a
  // reuse of the on-screen report's DOM/CSS.
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function buildEmailReportHtml(reportData) {
    const { z, effTier, band, validity, cognitive, strengths, derailers, traitById, rankedTraits } = reportData;
    const score = reportData.score;
    const bandColor = band === "Ready Now" ? "#00BFA6" : band === "Ready with Onboarding Support" ? "#FFB236" : "#FF6B6B";
    const famLabel = FAMILIES[state.setup.familyKey] ? FAMILIES[state.setup.familyKey].label : "";
    const tierLabel = TIERS[state.setup.tierKey] ? TIERS[state.setup.tierKey].label : "";
    const effTierLabel = TIERS[effTier] ? TIERS[effTier].label : tierLabel;
    const contextLabel = CONTEXTS[state.setup.contextKey] ? CONTEXTS[state.setup.contextKey].label : "";

    function infoRows(pairs) {
      return pairs.map(([k, v]) => (
        `<tr><td style="padding:6px 10px;font-weight:bold;background:#f2f2f2;border:1px solid #e0e0e0;width:220px;">${esc(k)}</td>` +
        `<td style="padding:6px 10px;border:1px solid #e0e0e0;">${esc(v)}</td></tr>`
      )).join("");
    }
    function sectionTitle(n, t) {
      return `<h2 style="color:#1F3864;font-size:17px;margin:26px 0 8px;border-bottom:2px solid #B08D57;padding-bottom:5px;">${esc(n + ". " + t)}</h2>`;
    }
    function subTitle(t) {
      return `<h3 style="color:#5F3DDB;font-size:14px;margin:16px 0 6px;">${esc(t)}</h3>`;
    }
    // A "bar" built from a nested table's cell widths — this renders reliably even
    // in email clients with poor CSS support (incl. Outlook desktop), unlike a
    // flex/grid or absolutely-positioned bar.
    function soloBar(pct, color) {
      const p = Math.max(0, Math.min(100, pct));
      return `<table style="border-collapse:collapse;width:100%;"><tr>` +
        `<td style="background:${color};height:10px;width:${p.toFixed(0)}%;font-size:1px;line-height:1px;">&nbsp;</td>` +
        `<td style="background:#eee;height:10px;width:${(100 - p).toFixed(0)}%;font-size:1px;line-height:1px;">&nbsp;</td>` +
        `</tr></table>`;
    }
    function barTableRow(label, pct, color) {
      return `<tr><td style="padding:4px 8px;font-size:12px;width:230px;">${esc(label)}</td>` +
        `<td style="padding:4px 8px;">${soloBar(pct, color)}</td></tr>`;
    }

    let html = `<div style="font-family:Arial,Helvetica,sans-serif;color:#222;max-width:700px;">`;
    html += `<div style="color:#5F3DDB;font-weight:bold;font-size:11px;letter-spacing:1px;text-transform:uppercase;">WCT Holdings Berhad — Learning &amp; Development</div>`;
    html += `<h1 style="color:#1F3864;font-size:21px;margin:4px 0 2px;">Behavioral Assessment &amp; Capability Profiling Tool</h1>`;
    html += `<div style="color:#889;font-size:12px;font-weight:bold;margin-bottom:10px;">Recruitment Edition</div>`;
    html += `<h2 style="color:#1F3864;font-size:17px;margin:16px 0 8px;">Candidate Assessment Report</h2>`;
    html += `<div style="color:#667;font-size:12px;margin-bottom:4px;">A copy of this report has also been saved to your configured SharePoint location (if set up).</div>`;
    html += `<div style="color:#667;font-size:12px;margin-bottom:12px;">Auto-submitted by the candidate on ${esc(new Date().toLocaleString())}</div>`;

    html += `<table style="border-collapse:collapse;width:100%;margin-bottom:18px;">` + infoRows([
      ["Candidate", state.setup.name || "(not entered)"],
      ["Position Applied For", state.positionApplied || "(not entered)"],
      ["IC / Identification No.", state.icNumber || "(not entered)"],
      ["Target Position (internal)", state.setup.title || "(not entered)"],
      ["Job Family", famLabel],
      ["Seniority Tier", tierLabel],
      ["Assessment Context", contextLabel],
      ["Date", new Date().toLocaleDateString()],
    ]) + `</table>`;

    if (validity.rating === "Invalid") {
      html += `<div style="background:#FFEAEA;border:2px solid #D8000C;border-radius:8px;padding:14px 16px;margin-bottom:12px;">` +
        `<div style="color:#D8000C;font-weight:800;font-size:14px;">⚠ LOW RESPONSE CONSISTENCY — DO NOT RELY ON THIS SCORE ALONE</div>` +
        `<div style="color:#8a0009;font-size:12.5px;margin-top:4px;">This candidate's answers were highly inconsistent across the response-consistency check ` +
        `(Response Consistency Score ${validity.index}/100). The Position Suitability Score below may not reflect this candidate accurately. ` +
        `Recommend re-assessment before using this report for a hiring decision.</div></div>`;
    }

    html += `<div style="background:${bandColor};color:#fff;border-radius:8px;padding:16px 18px;margin-bottom:10px;">` +
      `<div style="font-size:14px;opacity:.9;">Position Suitability Score</div>` +
      `<div style="font-size:34px;font-weight:800;">${Math.round(score)}%</div>` +
      `<div style="font-size:15px;font-weight:700;">Readiness Index: ${esc(band)}</div>` +
      `<div style="font-size:12.5px;margin-top:6px;">${esc(readinessAction(band))}</div></div>`;

    html += `<div style="margin-bottom:6px;font-size:13px;"><b>Validity:</b> ${esc(validity.rating)} (Response Consistency Score ${validity.index}/100)`;
    if (validity.flags.length) html += `<br/><span style="color:#B00020;">Flags: ${esc(validity.flags.join("; "))}</span>`;
    html += `</div>`;
    html += `<div style="margin-bottom:6px;font-size:13px;"><b>Cognitive Aptitude Score:</b> ${cognitive.overallPct}/100 (${esc(cognitiveBand(cognitive.overallPct))}) — see Section 12 for the Numerical/Logical breakdown</div>`;
    html += `<div style="font-size:11px;color:#889;margin-bottom:20px;">0 — Not Yet Ready &nbsp;|&nbsp; 70 — Onboarding Support &nbsp;|&nbsp; 85 — Ready Now &nbsp;|&nbsp; 100</div>`;

    // ================= 1. DOMAIN OVERVIEW =================
    html += sectionTitle(1, "Domain Overview");
    html += `<div style="font-size:12.5px;color:#556;margin-bottom:8px;">Each domain below is the average standardized score across its underlying traits, relative to the general working population (see the Ranked Trait Appendix for role-relative gaps).</div>`;
    html += `<table style="border-collapse:collapse;width:100%;margin-bottom:8px;">`;
    Object.keys(DOMAIN_LABELS).forEach((d) => {

  // ---------------- PDF GENERATION (for the auto-emailed/SharePoint-saved report) ----------------
  // Renders the same email-safe report HTML into a detached, off-screen container
  // (never appended anywhere the candidate's own screen shows, never toggled via
  // state.screen/render()) purely so html2pdf.js/html2canvas has a real DOM node
  // to rasterize, then removes it immediately. Resolves to a base64 PDF string,
  // or null if the PDF library didn't load (e.g. no internet) — submission still
  // proceeds without a PDF in that case rather than blocking on it.
  function buildReportPdfBase64(emailHtml) {
    return new Promise((resolve) => {
      try {
        if (typeof html2pdf !== "function") { resolve(null); return; }
        // html2canvas (which html2pdf uses under the hood) only rasterizes
        // content correctly when the target element sits at real, positive
        // document coordinates — pushing it off-screen with a large negative
        // left/top (the previous approach) makes html2canvas render a blank
        // page. To keep this fully invisible to the candidate without
        // breaking capture, we clip it via a zero-size "overflow: hidden"
        // wrapper pinned at (0,0) instead of moving the content itself
        // off-screen — the wrapper is what's clipped, not the content, so
        // html2canvas still sees a normally-positioned, normally-sized node.
        const wrapper = document.createElement("div");
        wrapper.style.position = "fixed";
        wrapper.style.top = "0";
        wrapper.style.left = "0";
        wrapper.style.width = "0";
        wrapper.style.height = "0";
        wrapper.style.overflow = "hidden";
        wrapper.style.pointerEvents = "none";
        const container = document.createElement("div");
        container.style.width = "760px";
        container.style.background = "#ffffff";
        container.style.padding = "16px";
        container.innerHTML = emailHtml;
        wrapper.appendChild(container);
        document.body.appendChild(wrapper);
        const cleanup = () => { if (wrapper.parentNode) wrapper.parentNode.removeChild(wrapper); };
        const opt = {
          margin: [10, 8, 10, 8],
          image: { type: "jpeg", quality: 0.95 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["css", "legacy"] },
        };
        html2pdf().set(opt).from(container).outputPdf("datauristring")
          .then((dataUri) => {
            cleanup();
            const base64 = (typeof dataUri === "string" && dataUri.includes(",")) ? dataUri.split(",")[1] : null;
            resolve(base64 || null);
          })
          .catch(() => { cleanup(); resolve(null); });
      } catch (err) {
        resolve(null);
      }
    });
  }

  // ---------------- REMOTE SUBMIT (candidate mode — auto-emails HR, never shows the report) ----------------
  function submitRemoteReport() {
    let reportData;
    try {
      reportData = computeReportData();
    } catch (err) {
      state.remoteSendStatus = "error";
      render();
      return;
    }
    const emailHtml = buildEmailReportHtml(reportData);
    const famLabel = FAMILIES[state.setup.familyKey] ? FAMILIES[state.setup.familyKey].label : "";
    const tierLabel = TIERS[state.setup.tierKey] ? TIERS[state.setup.tierKey].label : "";

    buildReportPdfBase64(emailHtml).then((pdfBase64) => {
      const templateParams = {
        to_email: state.delivery.hrEmail,
        candidate_name: state.setup.name || "(not entered)",
        position_applied: state.positionApplied || "(not entered)",
        ic_number: state.icNumber || "(not entered)",
        job_title: state.setup.title || "(not entered)",
        job_family: famLabel,
        seniority_tier: tierLabel,
        suitability_score: Math.round(reportData.score) + "%",
        readiness_index: reportData.band,
        validity_rating: reportData.validity.rating, // "Valid" | "Caution" | "Invalid" — usable in the flow's Subject if desired
        submitted_date: new Date().toLocaleString(),
        report_html: emailHtml,
        // Base64-encoded PDF of the same report — decode with base64ToBinary() in
        // Power Automate for a SharePoint "Create file" step, or use directly
        // (already base64) as an email "Attachment Content" field. Empty string
        // if PDF generation failed (e.g. no internet) — the flow should handle
        // that gracefully (skip the attachment/file) rather than error out.
        report_pdf_base64: pdfBase64 || "",
      };
      try {
        if (!state.delivery.flowUrl || !state.delivery.hrEmail) {
          throw new Error("Email delivery was not fully configured when this file was generated");
        }
        // Sent as text/plain (not application/json) so this stays a CORS-"simple"
        // request the browser never needs to preflight — the Power Automate flow
        // parses the raw body itself via json(triggerBody()). Because the flow's
        // response usually isn't readable cross-origin anyway, this uses "no-cors":
        // fetch() resolves as soon as the request leaves the browser successfully,
        // and only rejects on a genuine network failure (offline, bad URL, etc.) —
        // it can't confirm the flow itself completed or that Outlook actually sent
        // the mail. That's why HR is asked to test-send once before relying on it.
        fetch(state.delivery.flowUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(templateParams),
        })
          .then(() => { state.remoteSendStatus = "sent"; render(); })
          .catch(() => { state.remoteSendStatus = "error"; render(); });
      } catch (err) {
        state.remoteSendStatus = "error";
        render();
      }
    });
  }

  // ---------------- REMOTE SUBMIT SCREEN (candidate mode — no report, no "unlock") ----------------
  function renderRemoteSubmit() {
    const wrap = el("div", {}, []);
    const celebrate = el("div", { class: "celebrate-wrap" }, []);

    celebrate.appendChild(el("h2", { class: "section-title", style: "margin-top:6px;" }, [text("You're all done — thank you!")]));

    if (state.remoteSendStatus === "sent") {
      celebrate.appendChild(el("div", { class: "note-box", style: "text-align:left;" }, [text(
        "Your assessment has been submitted successfully. You may now close this window. Thank you for your time!"
      )]));

    (function animateRing() {
      const target = Math.max(0, Math.min(100, score));
      const duration = 900;
      let startTs = null;
      function step(ts) {
        if (!startTs) startTs = ts;
        const p = Math.min(1, (ts - startTs) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        const pct = target * eased;
        ring.style.background = `conic-gradient(${bandColor} ${pct}%, #e9ecf5 0)`;
        if (p < 1) requestAnimationFrame(step);
      }
      if (typeof requestAnimationFrame === "function") requestAnimationFrame(step);
      else ring.style.background = `conic-gradient(${bandColor} ${target}%, #e9ecf5 0)`;
