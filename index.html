      "Self-rated across four EQ subdomains (2 items each, averaged). Informational only — not blended into the Suitability Score or Readiness Index."
    )]));
    EQ_SUBDOMAINS.forEach((sd) => {
      const items = EQ_ITEMS.filter((eq) => eq.subdomain === sd);
      const vals = items.map((eq) => state.eq[eq.id]).filter((v) => v);
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
      const pct = (avg / 5) * 100;
      wrap.appendChild(el("div", { class: "domain-bar-row" }, [
        el("div", { class: "domain-bar-label" }, [text(`${sd} — ${avg ? avg.toFixed(1) + "/5" : "not answered"}`)]),
        el("div", { class: "domain-bar-track" }, [el("div", { class: "domain-bar-fill", style: `width:${pct}%;background:var(--violet);` })]),
      ]));
    });

    // ================= LIGHTWEIGHT IDP / ONBOARDING PLAN =================
    wrap.appendChild(el("h2", { class: "section-title", id: "sec-idp" }, [text("11. Lightweight Individual Development Plan (IDP)")]));
    wrap.appendChild(el("div", {}, [text(
      "Drawn from the top gap traits against this role's benchmark — a starting point for a 90-day onboarding/development conversation, not a finished plan."
    )]));
    const idpTable = el("table", { class: "report-table" }, []);
    idpTable.appendChild(el("tr", {}, [
      el("td", { style: "font-weight:bold;background:var(--navy);color:#fff;" }, [text("Focus Area")]),
      el("td", { style: "font-weight:bold;background:var(--navy);color:#fff;" }, [text("Why It Matters")]),
      el("td", { style: "font-weight:bold;background:var(--navy);color:#fff;" }, [text("Suggested Action")]),
      el("td", { style: "font-weight:bold;background:var(--navy);color:#fff;" }, [text("Target Timeframe")]),
    ]));
    const idpTimeframes = ["First 30 days", "30–60 days", "60–90 days"];
    if (derailers.length) {
      derailers.slice(0, 3).forEach((d, i) => {
        const meta = TRAIT_META[d.id];
        idpTable.appendChild(el("tr", {}, [
          el("td", {}, [text(d.label)]),
          el("td", {}, [text(`Directly relevant to ${meta.predicts}.`)]),
          el("td", {}, [text(`Provide extra structure, checklists, or a mentor for ${d.label.toLowerCase()}; revisit progress with the manager at the ${idpTimeframes[i].toLowerCase()} mark.`)]),
          el("td", {}, [text(idpTimeframes[i])]),
        ]));
      });
    } else {
      idpTable.appendChild(el("tr", {}, [el("td", { colspan: "4" }, [text("No material gaps detected against this role's benchmark — focus onboarding on role ramp-up rather than remediation.")])]));
    }
    wrap.appendChild(idpTable);

    // --- 12. Cognitive & Problem-Solving Aptitude ---
    wrap.appendChild(el("h2", { class: "section-title", id: "sec-cognitive" }, [text("12. Cognitive & Problem-Solving Aptitude")]));
    wrap.appendChild(el("div", {}, [text(
      "20 objective questions (10 calculation-based, 10 logic/puzzle-based) with a single correct answer each. Informational only — like Career Aspirations, Values Alignment, and the EQ Snapshot, this is never blended into the Position Suitability Score above."
    )]));
    const cogTable = el("table", { class: "report-table" }, []);
    [
      ["Overall Score", `${cognitive.overallPct}/100 (${cognitiveBand(cognitive.overallPct)})`],
      ["Correct Answers", `${cognitive.correctCount} of ${cognitive.totalCount}`],
      ["Numerical Reasoning", cognitive.numericalPct == null ? "n/a" : `${cognitive.numericalPct}/100`],
      ["Logical / Puzzle Reasoning", cognitive.logicalPct == null ? "n/a" : `${cognitive.logicalPct}/100`],
    ].forEach((row) => {
      cogTable.appendChild(el("tr", {}, [
        el("td", { style: "width:220px;font-weight:bold;background:var(--lightgrey);" }, [text(row[0])]),
        el("td", {}, [text(row[1])]),
      ]));
    });
    wrap.appendChild(cogTable);

    // --- actions ---
    const btnRow = el("div", { class: "no-print" }, []);
    btnRow.appendChild(el("button", { class: "btn secondary", onclick: () => window.print() }, [text("🖨 Print / Save as PDF")]));
    const downloadBtn = el("button", {
      class: "btn secondary", style: "margin-left:10px;",
      onclick: () => {
        const btn = downloadBtn;
        const originalLabel = "⬇ Download Report (PDF)";
        const resetBtn = () => { btn.textContent = originalLabel; btn.disabled = false; document.body.classList.remove("pdf-export-mode"); };
        try {
          if (typeof html2pdf !== "function") throw new Error("PDF library did not load (no internet connection?)");
          btn.textContent = "Generating PDF…";
          btn.disabled = true;
          document.body.classList.add("pdf-export-mode");
          const opt = {
            margin: [10, 8, 10, 8],
            filename: buildReportFilename(),
            image: { type: "jpeg", quality: 0.95 },
            html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
            pagebreak: { mode: ["css", "legacy"] },
          };
          html2pdf().set(opt).from(document.querySelector(".shell")).save()
            .then(resetBtn)
            .catch((err) => { resetBtn(); alert("Could not auto-generate the PDF (" + (err && err.message ? err.message : err) + "). Please use \"Print / Save as PDF\" instead."); });
        } catch (err) {
          resetBtn();
          alert("Could not auto-generate the PDF (" + (err && err.message ? err.message : err) + "). Please use \"Print / Save as PDF\" instead.");
        }
      }
    }, [text("⬇ Download Report (PDF)")]);
    btnRow.appendChild(downloadBtn);
    btnRow.appendChild(el("button", { class: "btn secondary", style: "margin-left:10px;", onclick: () => {
      if (confirm("Start a new assessment? This will clear the current answers.")) {
        Object.assign(state, {
          screen: "hrSetup", quadIndex: 0,
          setup: { name: "", title: "", familyKey: "", tierKey: "", contextKey: "recruitment" },
          quadAnswers: {}, quadTimes: {}, quadShownAt: null, likert: {}, bogus: {},
          likertStage: "rating", pickIndex: 0,
          cognitiveAnswers: {}, cognitiveIndex: 0,
          aspirations: { path: "", orientation: "", timeframe: "" }, values: {}, eq: {},
        });
        render();
      }
    }}, [text("Start New Assessment")]));
    wrap.appendChild(btnRow);

    renderScreen(wrap);
  }

  function render() {
    if (state.screen === "hrSetup") renderHrSetup();
    else if (state.screen === "candidateIntro") renderCandidateIntro();
    else if (state.screen === "activityIntro") renderActivityIntro();
    else if (state.screen === "quad") renderQuad();
    else if (state.screen === "cognitive") renderCognitive();
    else if (state.screen === "activityComplete") renderActivityComplete();
    else if (state.screen === "aboutyou") renderAboutYou();
    else if (state.screen === "likert") renderLikert();
    else if (state.screen === "handoff") renderHandoff();
    else if (state.screen === "results") renderResults();
    else if (state.screen === "remoteSubmit") renderRemoteSubmit();
    else if (state.screen === "linkError") renderLinkError();
  }

  render();
})();
</script></body></html>
